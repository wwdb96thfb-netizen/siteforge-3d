name: Build desktop installers
# Runs when desktop/release.txt changes (the owner's release switch).
on:
  push:
    branches: [main]
    paths: ['desktop/release.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refuse to build without the licence check code
        run: |
          if grep -q "S3DPUB-PENDING" main.js; then echo "Licence check code missing"; exit 1; fi
      - name: Install build tools
        run: npm ci
      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always
  finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach the Getting Started guide, publish, and remove old unlicensed releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          gh release upload "v$V" "desktop/docs/Sentinel-3D-Getting-Started.pdf" --clobber
          gh release edit "v$V" --draft=false --latest --title "Sentinel 3D $V" --notes-file desktop/release-notes.md
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            case "$t" in v3.*|v2.*|v1.*) gh release delete "$t" --yes --cleanup-tag || true ;; esac
          done
